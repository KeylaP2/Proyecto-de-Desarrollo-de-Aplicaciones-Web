<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>SoloTenisRD - Catálogo</title>
</head>
<body>
    <main class="registration-main">
        <article class="form-card">
            <header class="form-header">
                <h2>Catálogo Exclusivo</h2>
                <p>Añade tus tenis favoritos al carrito.</p>
                <p>Artículos en el Carrito: <strong id="contador-carrito">0</strong></p>
            </header>

            <ul class="registration-form" style="list-style: none; padding: 0;">
                
                <li class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #ccc; padding-bottom: 15px;">
                    <h3 style="margin: 0 0 10px 0;">Nike Air Force 1</h3>
                    <p class="field-label" style="font-weight: bold;">Precio: RD$ 5,500</p>
                    <button type="button" class="btn-signup btn-agregar-carrito" data-id="1" data-nombre="Nike Air Force 1" data-precio="5500">
                        Añadir al Carrito
                    </button>
                </li>

                <li class="form-group" style="margin-bottom: 25px; border-bottom: 1px solid #ccc; padding-bottom: 15px;">
                    <h3 style="margin: 0 0 10px 0;">Jordan 4 Retro</h3>
                    <p class="field-label" style="font-weight: bold;">Precio: RD$ 8,500</p>
                    <button type="button" class="btn-signup btn-agregar-carrito" data-id="2" data-nombre="Jordan 4 Retro" data-precio="8500">
                        Añadir al Carrito
                    </button>
                </li>

                <li class="form-group" style="margin-bottom: 25px; padding-bottom: 15px;">
                    <h3 style="margin: 0 0 10px 0;">Adidas Forum Low</h3>
                    <p class="field-label" style="font-weight: bold;">Precio: RD$ 4,800</p>
                    <button type="button" class="btn-signup btn-agregar-carrito" data-id="3" data-nombre="Adidas Forum Low" data-precio="4800">
                        Añadir al Carrito
                    </button>
                </li>

            </ul>
        </article>
    </main>

    <script src="catalogo.js"></script>
</body>
</html>

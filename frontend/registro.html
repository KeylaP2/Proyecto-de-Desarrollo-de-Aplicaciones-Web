<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | SoloTenisRD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="main-header text-center py-3">
        <div class="container position-relative">
        <nav class="navbar navbar-expand-md navbar-dark justify-content-center">
            <ul class="navbar-nav gap-2">
                <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
                <li class="nav-item"><a href="catalogo.html" class="nav-link">Catálogo</a></li>
            </ul>
        </nav>
        <div id="auth-navigation" class="auth-navigation" aria-live="polite"></div>
        </div>
    </header>
    <main class="registration-main py-5">
        <section class="container">
            <div class="row justify-content-center g-4">
                <article class="col-12 col-md-9 col-lg-6">
                    <div class="card form-card shadow-sm">
                        <header class="card-header form-header bg-white">
                            <button type="button" class="btn btn-link back-btn p-0 mb-3" onclick="history.back()">← Volver</button>
                            <h1 class="h3 mb-1">Regístrate</h1>
                            <p class="text-muted mb-0">Es rápido y sencillo.</p>
                        </header>

                        <form action="#" method="POST" class="card-body registration-form" id="registro-form">
                            <fieldset class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <input class="form-control" type="text" id="firstname" name="firstname" placeholder="Nombre">
                                    <span class="error-msg" id="error-firstname"></span>
                                </div>
                                <div class="col-12 col-md-6">
                                    <input class="form-control" type="text" id="lastname" name="lastname" placeholder="Apellido">
                                    <span class="error-msg" id="error-lastname"></span>
                                </div>
                            </fieldset>

                            <div class="mb-3">
                                <input class="form-control" type="email" id="email" name="email" placeholder="Correo electrónico">
                                <span class="error-msg" id="error-email"></span>
                            </div>

                            <div class="mb-3">
                                <input class="form-control" type="password" id="password" name="password" placeholder="Contraseña">
                                <span class="error-msg" id="error-password"></span>
                            </div>

                            <div class="mb-3">
                                <input class="form-control" type="password" id="confirm-password" name="confirm-password" placeholder="Confirmar contraseña">
                                <span class="error-msg" id="error-confirm-password"></span>
                            </div>

                            <div class="mb-3">
                                <input class="form-control" type="tel" id="phone" name="phone" placeholder="Teléfono" inputmode="numeric" maxlength="10" pattern="(809|829|849)[0-9]{7}">
                                <span class="error-msg" id="error-phone"></span>
                            </div>

                            <label class="form-label field-label">Fecha de nacimiento</label>
                            <section class="row g-2 mb-1">
                                <div class="col-4">
                                    <select class="form-select" name="day" id="day">
                                        <option value="">Día</option>
                                        <option value="01">01</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <select class="form-select" name="month" id="month">
                                        <option value="">Mes</option>
                                        <option value="01">01</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <select class="form-select" name="year" id="year">
                                        <option value="">Año</option>
                                        <option value="2026">2026</option>
                                    </select>
                                </div>
                            </section>
                            <span class="error-msg" id="error-fecha"></span>

                            <label class="form-label field-label mt-3">Género</label>
                            <section class="row g-2 mb-1" id="gender-container">
                                <div class="col-12 col-sm-4">
                                    <label class="gender-option form-check border rounded px-3 py-2 w-100">
                                        <span>Mujer</span>
                                        <input class="form-check-input" type="radio" name="gender" value="Mujer">
                                    </label>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <label class="gender-option form-check border rounded px-3 py-2 w-100">
                                        <span>Hombre</span>
                                        <input class="form-check-input" type="radio" name="gender" value="Hombre">
                                    </label>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <label class="gender-option form-check border rounded px-3 py-2 w-100">
                                        <span>Otro</span>
                                        <input class="form-check-input" type="radio" name="gender" value="Otro">
                                    </label>
                                </div>
                            </section>
                            <span class="error-msg" id="error-gender"></span>

                            <div id="form-mensaje" class="my-3 text-center fw-bold"></div>

                            <footer class="form-footer">
                                <p class="disclaimer text-muted small">Al hacer clic en "Sign Up", aceptas nuestras condiciones.</p>
                                <button type="submit" class="btn btn-danger btn-signup w-100">Sign Up</button>
                            </footer>
                        </form>
                    </div>
                </article>

            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="security.js"></script>
    <script src="auth.js"></script>
    <script src="registro.js"></script>
</body>

</html>

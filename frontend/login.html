<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | SoloTenisRD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header text-center">
        <div class="container py-4">
            <h1 class="main-title h2 fw-black text-uppercase mb-2">SoloTenis<span>RD</span></h1>
            <nav class="navbar navbar-expand-md navbar-dark justify-content-center">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
                    <li class="nav-item"><a href="catalogo.html" class="nav-link">Catálogo</a></li>
                    <li class="nav-item"><a href="registro.html" class="nav-link">Registro</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="login-main d-flex align-items-center py-5">
        <section class="container">
            <article class="card form-card shadow-sm login-card mx-auto">
                <div class="card-body p-4 p-md-5">
                    <h2 class="h3 text-center mb-2">Iniciar sesión</h2>
                    <p class="text-muted text-center mb-4">Accede con el correo y la contraseña de tu cuenta o administración.</p>
                    <form id="login-form" novalidate>
                        <div class="mb-3"><label class="form-label" for="login-email">Correo electrónico</label><input class="form-control" id="login-email" type="email" autocomplete="email" required></div>
                        <div class="mb-3"><label class="form-label" for="login-password">Contraseña</label><input class="form-control" id="login-password" type="password" autocomplete="current-password" required></div>
                        <p id="login-mensaje" class="small text-center" aria-live="polite"></p>
                        <button class="btn btn-danger btn-signup w-100" type="submit">Entrar</button>
                    </form>
                    <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
                </div>
            </article>
        </section>
    </main>
    <script src="security.js"></script>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
